<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>발로란트 전략 가이드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0F1923;
            color: #ece8e1;
        }
        .font-gabarito { font-family: 'Gabarito', sans-serif; }
        .card {
            background-color: rgba(31, 46, 59, 0.8);
            border: 1px solid #3F5161;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(255, 70, 85, 0.25);
            border-color: #FF4655;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-[#16212D] border-b border-[#3F5161] sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-20 flex items-center gap-3">
            <div class="w-5 h-4 bg-[#FF4655] transform rotate-45 origin-top-left mt-1"></div>
            <h1 class="text-xl font-gabarito font-bold text-white tracking-wide">발로란트 전략 가이드</h1>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-6 py-16">
        <div class="max-w-4xl w-full">
            <div class="text-center mb-12">
                <h2 class="text-4xl md:text-5xl font-gabarito font-extrabold text-white mb-4">
                    VALORANT <span class="text-[#FF4655]">STRATEGY</span>
                </h2>
                <p class="text-lg text-[#9CA9B6]">요원 · 맵 · 전략 추천 가이드</p>
            </div>

            <div class="grid md:grid-cols-3 gap-6">
                <a href="agents.html" class="card rounded-xl p-8 text-center block">
                    <div class="text-4xl mb-4">👤</div>
                    <h3 class="text-xl font-bold text-white mb-2">요원 데이터</h3>
                    <p class="text-sm text-[#9CA9B6]">요원별 능력, 역할, 데이터 관리</p>
                </a>
                <a href="maps.html" class="card rounded-xl p-8 text-center block">
                    <div class="text-4xl mb-4">🗺️</div>
                    <h3 class="text-xl font-bold text-white mb-2">맵 가이드</h3>
                    <p class="text-sm text-[#9CA9B6]">맵별 추천 요원 & 전략</p>
                </a>
                <a href="haven.html" class="card rounded-xl p-8 text-center block">
                    <div class="text-4xl mb-4">🏰</div>
                    <h3 class="text-xl font-bold text-white mb-2">Haven 맵</h3>
                    <p class="text-sm text-[#9CA9B6]">Haven 상세 전략 & 추천</p>
                </a>
            </div>
        </div>
    </main>

    <footer class="border-t border-[#3F5161] py-6 text-center text-sm text-[#9CA9B6]">
        Valorant Strategy Guide · GitHub Pages
    </footer>
</body>
</html>
