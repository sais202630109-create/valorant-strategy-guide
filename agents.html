<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>발로란트 전략 가이드 - 요원 데이터 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #0F1923;
            color: #ece8e1;
        }
        .font-gabarito { font-family: 'Gabarito', sans-serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
        
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0F1923; }
        ::-webkit-scrollbar-thumb { background: #3F5161; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #FF4655; }

        /* 폼 요소 포커스 스타일 커스텀 */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #FF4655 !important;
            box-shadow: 0 0 0 1px #FF4655;
        }
        
        /* select 기본 화살표 숨기기 */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239CA9B6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-[#16212D] border-b border-[#3F5161] sticky top-0 z-50">
        <div class="max-w-[1440px] mx-auto px-6 lg:px-[60px] h-20 flex items-center justify-between">
            <!-- 로고 영역 -->
            <div class="flex items-center gap-3">
                <div class="w-5 h-4 bg-[#FF4655] transform rotate-45 origin-top-left mt-1"></div>
                <h1 class="text-xl font-gabarito font-bold text-white tracking-wide">발로란트 전략 가이드</h1>
            </div>
            <!-- 네비게이션 -->
            <nav class="hidden md:flex items-center gap-8">
                <a href="maps.html" class="text-[#9CA9B6] hover:text-white transition-colors font-medium">맵 가이드</a>
                <a href="haven.html" class="text-[#9CA9B6] hover:text-white transition-colors font-medium">Haven</a>
                <a href="agents.html" class="text-[#FF4655] font-medium">요원 데이터</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-[1440px] mx-auto w-full px-6 lg:px-[60px] py-10">
        <div class="mb-8">
            <h2 class="text-3xl font-gabarito font-bold text-white mb-2">요원 데이터 관리</h2>
            <p class="text-[#9CA9B6]">요원 정보를 추가, 수정, 삭제할 수 있습니다.</p>
        </div>

        <!-- 폼 영역 -->
        <div class="bg-[#1F2E3B] border border-[#3F5161] rounded-xl p-6 mb-10">
            <form id="agentForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium text-[#9CA9B6] mb-2">요원 이름</label>
                    <input type="text" id="agentName" class="w-full bg-[#0F1923] border border-[#3F5161] rounded-lg px-4 py-2.5 text-white" placeholder="예: 제트" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#9CA9B6] mb-2">역할</label>
                    <select id="agentRole" class="w-full bg-[#0F1923] border border-[#3F5161] rounded-lg px-4 py-2.5 text-white" required>
                        <option value="">역할 선택</option>
                        <option value="타격대">타격대</option>
                        <option value="척후대">척후대</option>
                        <option value="감시자">감시자</option>
                        <option value="전략가">전략가</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#9CA9B6] mb-2">원거리 / 근거리</label>
                    <select id="agentRange" class="w-full bg-[#0F1923] border border-[#3F5161] rounded-lg px-4 py-2.5 text-white">
                        <option value="원거리">원거리</option>
                        <option value="근거리">근거리</option>
                        <option value="혼합">혼합</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-[#9CA9B6] mb-2">주요 능력 설명</label>
                    <textarea id="agentAbility" rows="3" class="w-full bg-[#0F1923] border border-[#3F5161] rounded-lg px-4 py-2.5 text-white" placeholder="능력 설명 입력"></textarea>
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-[#FF4655] hover:bg-[#E03C4A] text-white font-medium py-2.5 px-6 rounded-lg transition-colors">
                        요원 추가 / 수정
                    </button>
                </div>
            </form>
        </div>

        <!-- 테이블 영역 -->
        <div class="bg-[#1F2E3B] border border-[#3F5161] rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-[#16212D] text-[#9CA9B6] text-sm">
                        <tr>
                            <th class="px-6 py-4 font-medium">요원</th>
                            <th class="px-6 py-4 font-medium">역할</th>
                            <th class="px-6 py-4 font-medium">사거리</th>
                            <th class="px-6 py-4 font-medium">능력</th>
                            <th class="px-6 py-4 font-medium text-right">관리</th>
                        </tr>
                    </thead>
                    <tbody id="agentTableBody" class="divide-y divide-[#3F5161]">
                        <!-- JS로 채워짐 -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="border-t border-[#3F5161] py-6 text-center text-sm text-[#9CA9B6]">
        Valorant Strategy Guide
    </footer>

    <script>
        // 간단한 로컬 스토리지 기반 요원 관리
        let agents = JSON.parse(localStorage.getItem('valorantAgents') || '[]');
        let editIndex = -1;

        function renderTable() {
            const tbody = document.getElementById('agentTableBody');
            tbody.innerHTML = agents.map((a, i) => `
                <tr class="hover:bg-[#16212D]/transition-colors">
                    <td class="px-6 py-4 font-medium text-white">${a.name}</td>
                    <td class="px-6 py-4"><span class="px-2.5 py-1 rounded text-xs font-medium bg-[#3F5161]">${a.role}</span></td>
                    <td class="px-6 py-4 text-[#9CA9B6]">${a.range}</td>
                    <td class="px-6 py-4 text-[#9CA9B6] max-w-xs truncate">${a.ability || '-'}</td>
                    <td class="px-6 py-4 text-right space-x-2">
                        <button onclick="editAgent(${i})" class="text-[#9CA9B6] hover:text-[#FF4655]">수정</button>
                        <button onclick="deleteAgent(${i})" class="text-[#9CA9B6] hover:text-red-400">삭제</button>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="5" class="px-6 py-8 text-center text-[#9CA9B6]">등록된 요원이 없습니다.</td></tr>';
        }

        document.getElementById('agentForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const agent = {
                name: document.getElementById('agentName').value.trim(),
                role: document.getElementById('agentRole').value,
                range: document.getElementById('agentRange').value,
                ability: document.getElementById('agentAbility').value.trim()
            };
            if (editIndex >= 0) {
                agents[editIndex] = agent;
                editIndex = -1;
            } else {
                agents.push(agent);
            }
            localStorage.setItem('valorantAgents', JSON.stringify(agents));
            renderTable();
            e.target.reset();
        });

        function editAgent(i) {
            const a = agents[i];
            document.getElementById('agentName').value = a.name;
            document.getElementById('agentRole').value = a.role;
            document.getElementById('agentRange').value = a.range;
            document.getElementById('agentAbility').value = a.ability || '';
            editIndex = i;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteAgent(i) {
            if (confirm('정말 삭제하시겠습니까?')) {
                agents.splice(i, 1);
                localStorage.setItem('valorantAgents', JSON.stringify(agents));
                renderTable();
            }
        }

        renderTable();
    </script>
</body>
</html>
